# Stack Docker Swarm pour Immersio Backend avec MongoDB Dockerisé
version: "3.8"

services:
  nginx:
    image: nginx:1.21.5-alpine
    configs:
      - source: "{{ nginx_config_name }}"
        target: /etc/nginx/conf.d/default.conf
        mode: 0440
    networks:
      - immersio
      - "{{ traefik_network }}"
    
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.constraint-label=traefik-public
        # Http router: redirection to https
        - traefik.http.routers.{{ env }}-nginx-immersio_backend-http.rule=Host(`{{ hostname }}`)
        - traefik.http.routers.{{ env }}-nginx-immersio_backend-http.entrypoints=http
        - traefik.http.routers.{{ env }}-nginx-immersio_backend-http.middlewares=https-redirect
        # Https router
        - traefik.http.routers.{{ env }}-nginx-immersio_backend-https.rule=Host(`{{ hostname }}`)
        - traefik.http.routers.{{ env }}-nginx-immersio_backend-https.entrypoints=https
        - traefik.http.routers.{{ env }}-nginx-immersio_backend-https.tls=true
        - traefik.http.routers.{{ env }}-nginx-immersio_backend-https.tls.certresolver=letsencrypt
        # Pointing to nginx
        - traefik.http.services.{{ env }}-nginx-immersio_backend.loadbalancer.server.port=80

  api:
    image: "{{ image }}"  
    networks:
      - immersio
    env_file:
      - ./.flask.env
      - ./.mongo.env
    environment:
      - MONGO_URL=mongodb://db:27017/
      - DB_NAME=immersio_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/uploads 
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=false
      placement:
        constraints:
          - node.role == manager

  db:
    image: mongo:7
    networks:
      - immersio
    volumes:
      - db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

volumes: 
  media:
  db_data:

networks:
  immersio:
    name: "{{ env }}-immersio-backend"
  "{{ traefik_network }}":
    external: true

configs:
  "{{ nginx_config_name }}":
    external: true